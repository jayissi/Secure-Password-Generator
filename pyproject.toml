[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-password-generator"
version = "2.0.0"
description = "Cryptographically secure password generator with AES-GCM-SIV encrypted vault"
requires-python = ">=3.13"
license = "MIT"
readme = "README.md"
dependencies = [
    "argcomplete>=3.0.0",
    "cryptography>=44.0.0",
    "pyperclip>=1.9.0",
    "PyYAML>=6.0",
    "segno>=1.6.0",
    "tabulate>=0.9.0",
    "textual>=0.80.0",
]

[project.scripts]
pwgen = "secure_password_generator.cli:main"

[dependency-groups]
dev = [
    "bandit>=1.7.0",
    "pymarkdownlnt>=0.9.0",
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-textual-snapshot>=1.0.0",
    "ruff>=0.9.0",
]

# ── Pytest Configuration ────────────────────────────────────────────────
# pytest reads this section automatically when invoked from the project
# root.  No pytest.ini or setup.cfg needed.
#
# Standard test run:
#   pytest tests/ -v
#
# The test-mode Argon2id profile (SPG_TEST_KDF=1) is applied
# automatically by a module-level statement in tests/conftest.py.
# No environment variable needs to be set manually.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=secure_password_generator --cov-report=term-missing"
asyncio_mode = "auto"

# ── Ruff Linter Configuration ──────────────────────────────────────────
# Run: ruff check secure_password_generator/ tests/ benchmarks/
[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "FURB", "RUF", "PLW", "EXE"]

# ── Bandit Security Linter Configuration ───────────────────────────────
# Run: bandit -r secure_password_generator/ -c pyproject.toml
[tool.bandit]
exclude_dirs = ["tests", "benchmarks"]
skips = [
    "B404",     # import subprocess -- needed for shred secure deletion
    "B603",     # subprocess without shell -- hardcoded command array, no injection
]

# ── Pyright Type-Checking Configuration ────────────────────────────────
# Run: pyright secure_password_generator/ tests/
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["secure_password_generator", "tests"]
