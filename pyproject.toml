[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-password-generator"
version = "2.0.0"
description = "Cryptographically secure password generator with AES-GCM-SIV encrypted vault"
requires-python = ">=3.13"
license = "MIT"
readme = "README.md"
dependencies = [
    "argcomplete>=3.0.0",
    "cryptography>=44.0.0",
    "pyperclip>=1.9.0",
    "PyYAML>=6.0",
    "tabulate>=0.9.0",
]

[project.scripts]
pwgen = "secure_password_generator.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

# ── Pytest Configuration ────────────────────────────────────────────────
# pytest reads this section automatically when invoked from the project
# root.  No pytest.ini or setup.cfg needed.
#
# Standard test run:
#   pytest tests/ -v
#
# The test-mode Argon2id profile (SPG_TEST_KDF=1) is applied
# automatically by a module-level statement in tests/conftest.py.
# No environment variable needs to be set manually.
[tool.pytest.ini_options]
testpaths = ["tests"]

# ── Ruff Linter Configuration ──────────────────────────────────────────
# Run: ruff check secure_password_generator/ tests/ benchmarks/
[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "FURB", "RUF", "PLW", "EXE"]
ignore = [
    "BLE001",   # Blind except -- intentional in security/clipboard code
    "S110",     # try-except-pass -- intentional for clipboard fallbacks
    "SIM105",   # contextlib.suppress -- keep explicit try/except for clarity
    "DTZ005",   # datetime.now without tz -- local display timestamps
    "DTZ007",   # strptime without %z -- parsing stored timestamps
    "PLW0603",  # global statement -- intentional for clipboard/key caching
    "B905",     # zip without strict -- length pre-validated in combine_keys
]

# ── Pyright Type-Checking Configuration ────────────────────────────────
# Run: pyright secure_password_generator/ tests/
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["secure_password_generator", "tests"]
