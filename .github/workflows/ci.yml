---
# Local dry-run: see tests/README.md "CI / Container Usage"
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e . -r requirements.txt
      - run: ruff check secure_password_generator/ tests/ benchmarks/
      - run: pyright secure_password_generator/ tests/
      - run: bandit -r secure_password_generator/ -c pyproject.toml
      - run: pymarkdown --config .pymarkdown.json scan **/*.md

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: pip install -e . -r requirements.txt
      - run: pytest tests/ -v --tb=short

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: |
          pwgen -V
          pwgen -F -L 16 -n
          pwgen -F -x -L 20 -n
