# Secure Password Generator - Example Config File
# All fields are optional. Omitted fields fall back to CLI defaults.
# CLI arguments always take precedence over config values.

length: 24
count: 1
upper: true
lower: true
digits: true
symbols: true
no_repeats: true
exclude_similar: false
min_chars: 2
allowed_symbols: "!@#$%^&*?`"
blank_space: false
latin_ext: false
save_history: true
clipboard: false
qr: false
# QR code output file (leave blank or comment out to skip).
# qr_file: "password_qr.png"

# Pattern-based generation (overrides character type flags when set).
# Leave blank or comment out to use normal generation.
# pattern: "llbuubddbssbxx"

# Optional metadata defaults
label: "My Default Label"
category: "General"
tags: "default,work"
